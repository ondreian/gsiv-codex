[package]
name = "gsiv-codex"
version = "0.5.0"
edition = "2024"
description = "A unified data layer for GemStone IV: world, verbs, foes, items"
license = "MIT"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
