name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - id: pin
        run: echo "sha=$(grep '^sha256=' vendor/mapdb.source | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: vendor/map.json
          key: mapdb-${{ steps.pin.outputs.sha }}
      - run: ./scripts/vendor.sh

      - name: the tag must be the crate version
        run: |
          crate=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          # A release whose filename disagrees with the version stamped inside
          # it is a support question nobody can answer.
          [ "$crate" = "$tag" ] || { echo "tag $tag != crate $crate"; exit 1; }

      - run: cargo run --release --bin codex -- build
               --from vendor/map.json --out codex.db3 --vocabulary data
      - name: it does not ship unless it is fit to publish
        run: CODEX=codex.db3 cargo test --release --test publishable

      # What a consumer needs before downloading 30 MB: which engine versions
      # can read it, and what it is built from.
      - name: describe it
        run: |
          eval "$(grep -E '^(repo|commit)=' vendor/mapdb.source)"
          {
            # The tag's own subject, first and alone on its line. A consumer
            # listing what it has installed shows one line per release, and
            # without this the first line of a release body is the meta table.
            git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME"
            echo
            echo "| | |"
            echo "| --- | --- |"
            # Empty meta is not worth a row: `urnon_max` is normally empty and
            # means "no known ceiling", which a blank cell states badly.
            sqlite3 codex.db3 \
              "SELECT '| \`' || key || '\` | ' ||
                      CASE key WHEN 'built_at'
                        THEN datetime(CAST(value AS INTEGER), 'unixepoch') || ' UTC'
                        ELSE value END || ' |'
                 FROM codex_meta WHERE value <> '' ORDER BY key"
            echo "| \`mapdb\` | [$repo@\`$commit\`](https://github.com/$repo/tree/$commit) |"
            echo
            echo "Reads with no flag: urnon's \`World::load_any\` recognises the schema."
            echo
            echo "\`\`\`sh"
            echo "zstd -d codex.db3.zst -o ~/.local/share/urnon/codex.db3"
            echo "\`\`\`"
          } > notes.md
      - run: zstd -19 codex.db3 -o codex.db3.zst && sha256sum codex.db3.zst > codex.db3.zst.sha256

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            codex.db3.zst
            codex.db3.zst.sha256
